# xray-memory: a code graph and semantic memory served over MCP, from pre-built
# snapshots. Three artifacts move together here:
#
#   server image  ghcr.io/den-vasyliev/abox/xray-memory:v1.23.66-61e4eaa
#   chart         oci://ghcr.io/den-vasyliev/abox/charts/xray-memory:0.6.0
#   maps image    ghcr.io/vanelin/abox/xray-memory-maps:<catalog hash>  (lab 5, our own)
#
# The chart runs the server in SNAPSHOT mode (`serve-snapshots`): one graph and
# index per map, loaded lazily from a pre-built <label>.graph.gob.gz. Live mode
# parses source on the node and is a workstation mode; the chart does not
# template it.
apiVersion: v1
kind: Namespace
metadata:
  name: xray-memory
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: xray-memory
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/den-vasyliev/abox/charts/xray-memory
  ref:
    tag: "0.6.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: xray-memory
  namespace: xray-memory
spec:
  interval: 1h
  releaseName: xray-memory
  chartRef:
    kind: OCIRepository
    name: xray-memory
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # image.tag is deliberately unset: the chart defaults it to .Chart.AppVersion,
    # which is v1.23.66-61e4eaa on chart 0.6.0. Chart and server image move as
    # one artifact, so pinning the tag here would only let them drift.
    #
    # Not 0.6.3, which upstream's feat/otel-demo moved to: that chart's
    # appVersion is v1.23.73-df0cf10 and no such image is published (checked
    # 2026-09-20: 0.6.0/0.6.1/0.6.2/0.7.0 have theirs), so the pod sits in
    # ImagePullBackOff. 0.6.0 is also the version the maps CI builds with.

    # The server edits a worked copy of each map and flushes it back, so
    # update_code_graph is accepted and `remember` registers a tool that writes
    # into the `session` map (server.memoryMap). That needs a volume it can
    # write to: the chart refuses writable=true with snapshots.source=image
    # outright, because an image volume is a read-only mount and nothing written
    # there lands anywhere.
    server:
      writable: true

    snapshots:
      # pvc, not ephemeral. An emptyDir is empty at every pod start, so the
      # worked copies and everything `remember` wrote are lost on any restart,
      # reschedule or rollout -- session notes, not a store. A claim keeps them.
      # KinD's local-path provisioner is the default StorageClass; size (5Gi),
      # accessModes (RWO) and the empty storageClass are chart defaults.
      #
      # The claim still dies with the CLUSTER: Docker's data-root is under /tmp
      # on Codespaces, so a restart takes local-path's volumes with it, exactly
      # as it does Qdrant's.
      source: pvc

      # With source=pvc the maps no longer arrive as the volume itself, so a
      # fresh claim is seeded from the maps image: it is mounted as an image
      # volume and an initContainer copies every *.graph.gob.gz across, ONLY for
      # files the volume does not already hold. overwrite stays false (the chart
      # default) so a redeploy cannot erase a worked copy or the notes.
      #
      # ImageVolume is beta and on by default from Kubernetes 1.33; the chart's
      # kubeVersion refuses anything older and bootstrap/variables.tf pins the
      # node image at v1.37.0.
      #
      # The tag is pinned rather than `latest` because an image volume is
      # resolved when the pod is created, so a moved tag would only be picked up
      # on pod recreation -- and here it would land as new files beside the old
      # ones rather than replacing them.
      seed:
        enabled: true
        images:
          # Lab 5: our own maps image, built by
          # .github/workflows/xray-memory-maps-image.yaml from
          # docs/labs/05/data/*.catalog.json and encrypted to this cluster's
          # identity. The tag is the hash of the catalogs, so a changed corpus
          # is a new tag here. Upstream's xray-memory-maps:2026-09-16 is not
          # seeded: both of its maps are encrypted to the instructor's key, the
          # server skips them, and with nothing else in the volume it exits.
          - reference: ghcr.io/vanelin/abox/xray-memory-maps:8eb20ad7b831
            pullPolicy: IfNotPresent
            path: /maps

      # A snapshot is gzip over gob, so anyone who can pull the maps image can
      # `strings` every node's text -- for a catalog map that is people's names
      # and roles. Maps built with `-snapshot-recipient age1...` are
      # age-encrypted instead: same file names, same image layout, and only the
      # server needs the identity to open them.
      #
      # The identity is in this repo only SOPS-encrypted, as
      # releases/secrets/xray-memory-snapshot-key.yaml; Flux decrypts it with
      # flux-system/sops-age (scripts/secrets.sh) in the same apply that creates
      # this release. Until the Secret exists the kubelet retries the volume
      # mount and the pod waits in ContainerCreating.
      #
      # secretKey (identity) and mountPath are chart defaults; the server reads
      # the file from $XRAY_SNAPSHOT_KEY. A directory may mix encrypted and
      # plaintext maps -- an encrypted map found with no key is skipped with a
      # warning and the rest still serve, so a missing key degrades to fewer
      # maps, not a crash.
      #
      # The key reads, the recipient writes. Now that the server flushes, a map
      # that arrived encrypted is re-encrypted on every flush and is never
      # downgraded -- but the `session` notes map is created here, so without
      # a recipient it would be written PLAINTEXT onto the claim. extraEnv below
      # sets XRAY_SNAPSHOT_RECIPIENT for that.
      encryption:
        enabled: true
        secretName: xray-memory-snapshot-key

    # Lab 5: the recipient half, so the `session` notes map is written
    # encrypted as well -- notes are what a user told an agent, the one part of
    # this volume that is not derived from public data. It is the public key of
    # the identity in releases/secrets/xray-memory-snapshot-key.yaml
    # (`age-keygen -y`), and the same one the maps image is built to
    # (.github/workflows/xray-memory-maps-image.yaml).
    extraEnv:
      - name: XRAY_SNAPSHOT_RECIPIENT
        value: age1uw9aa98ksd7hc29yt7tqycnvqy6yf3q4k4nzexhl9hhtqknd8glqugq46f

    # Query embedding comes from an in-pod llama.cpp sidecar, not from a shared
    # endpoint. model/dims/maxInputChars are the snapshot FINGERPRINT -- every
    # map served must have been built with the same three -- and the sidecar is
    # what makes that one pod's property instead of something to keep in step
    # with another release. embeddings.endpoint is ignored while this is on; the
    # server is pointed at localhost.
    #
    # The chart renders it as a NATIVE sidecar (initContainer with
    # restartPolicy: Always), so the kubelet starts it first and waits for its
    # startupProbe before the server container starts: the first search never
    # races the model load.
    #
    # dims 256 is a CLIENT-side Matryoshka truncation in the server -- llama.cpp
    # returns nomic's native 768 either way, and 256 is the knee every shipped
    # snapshot was built at. It is the hard check: a mismatch skips the map at
    # load, and the chart refuses the sidecar outright at any other dims unless
    # allowOtherDims is set.
    embeddings:
      sidecar:
        enabled: true
        # Required when enabled -- the chart names no registry and guesses no
        # public image. This is abox's own embedder image, the one
        # releases/llama-cpp-embeddings.yaml runs: a llama.cpp server base with
        # nomic-embed-text-v1.5 GGUF baked at /models/model.gguf, which is the
        # chart's default modelPath. Baked means nothing is fetched from
        # HuggingFace at pod start, which matters on Codespaces where egress is
        # broken until `make fix-egress` runs.
        #
        # amd64 ONLY -- a single manifest, not an index. It will not run
        # natively on an arm64 node.
        image: ghcr.io/den-vasyliev/abox/nomic-embed:v1.18.1-4ccc0ff
        # port, modelPath, extraArgs (--ctx-size 16384 --ubatch-size 2048
        # --parallel 8), the 60s startup budget and the resources are all left
        # at the chart defaults: they are the same production embedder sidecar
        # the standalone Deployment was copied from, down to the 500m request.
    #
    # This drops the only cross-release dependency xray-memory had. It no longer
    # needs releases/llama-cpp-embeddings.yaml to be up, or to be serving the
    # same GGUF it was serving when the maps were built.

    # Left at the chart defaults, spelled out because they are the interesting
    # ones:
    #
    #   server.memoryMap  session   the map `remember` writes into, created on
    #                               first use as <mountPath>/session.graph.gob.gz
    #                               and flushed after every note.
    #   server.skillsMap  skills    backs list_skills / get_skill.
    #   service           ClusterIP :8085
    #   ingress.enabled   false
    #
    # Every endpoint the server exposes -- /mcp, /ui, /search, /graph, /node,
    # /status, /metrics -- is unauthenticated, and the writes above go through
    # /mcp with no auth in front of them, so it stays cluster-internal: no
    # HTTPRoute onto agentgateway-external, unlike the embeddings backends.
    #
    #   in-cluster MCP: http://xray-memory.xray-memory:8085/mcp
