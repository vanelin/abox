apiVersion: v1
kind: Namespace
metadata:
  name: phoenix
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: phoenix
  namespace: flux-system
spec:
  interval: 1h
  url: oci://registry-1.docker.io/arizephoenix/phoenix-helm
  ref:
    tag: "12.0.14"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phoenix
  namespace: phoenix
spec:
  interval: 1h
  releaseName: phoenix
  chartRef:
    kind: OCIRepository
    name: phoenix
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # The cluster routes through the agentgateway Gateway, not an Ingress.
    ingress:
      enabled: false
    # Lab 6: no login, so the collector can send traces without a key that
    # dies with the cluster. Lab only; outside it sits behind ngrok's Google sign-in.
    auth:
      enableAuth: false
    # Lab 7: served at /phoenix on the ngrok domain. The route strips the prefix,
    # as in Phoenix's own reverse-proxy example; the collector keeps using /.
    server:
      hostRootPath: /phoenix
      rootUrl: https://cape-lethargic-sizing.ngrok-free.dev/phoenix
    # The chart's startup probe allows 31s (periodSeconds 1 x failureThreshold
    # 30). Phoenix runs Alembic migrations against Postgres on first boot, which
    # takes longer than that on KinD, so the probe kills the container before it
    # ever binds :6006 and it restarts forever:
    #
    #   Startup probe failed: dial tcp 10.244.2.10:6006: connect: connection refused
    #   Container phoenix failed startup probe, will be restarted
    #
    # Widen the budget to 10 minutes. Liveness and readiness are left alone --
    # they only start counting once the startup probe succeeds.
    healthChecks:
      startupProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 120
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phoenix
  namespace: phoenix
spec:
  parentRefs:
    - name: agentgateway-external
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /phoenix
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: phoenix-svc
          port: 6006
