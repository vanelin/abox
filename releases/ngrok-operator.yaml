# Lab 7: the one public entry. The free plan has a single domain, so it fronts
# agentgateway-external and HTTPRoutes split it by path: / and /api kagent,
# /mlflow, /phoenix, and the demo's /feature and /chatbot.
#
# Nothing behind it has its own login, so Google sign-in comes first and only
# the listed address gets through. Free plan: 20k requests and 1 GB a month --
# for demos; kagent's UI alone polls every few seconds.
apiVersion: ngrok.k8s.ngrok.com/v1alpha1
kind: AgentEndpoint
metadata:
  name: abox
  namespace: agentgateway-system
spec:
  url: https://cape-lethargic-sizing.ngrok-free.dev
  upstream:
    url: http://agentgateway-external.agentgateway-system:80
  trafficPolicy:
    inline:
      on_http_request:
        - actions:
            - type: oauth
              config:
                provider: google
        - expressions:
            - "!(actions.ngrok.oauth.identity.email in ['vano3231@gmail.com'])"
          actions:
            - type: deny
              config:
                status_code: 403
