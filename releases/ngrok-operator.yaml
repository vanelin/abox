# Lab 7: the one public entry. The free plan has a single domain, so it fronts
# agentgateway-external and HTTPRoutes split it by path: / and /api kagent,
# /mlflow, /phoenix, and the demo's /feature and /chatbot.
#
# Nothing behind it has its own login, so Google sign-in comes first and only
# the listed address gets through. Free plan: 20k requests and 1 GB a month --
# for demos; kagent's UI alone polls every few seconds.
# The operator would otherwise create this Domain itself with its own
# description and metadata, then fail to write them to a dev domain
# (ERR_NGROK_454), leaving Domain and AgentEndpoint Ready=False. Matching what
# ngrok already holds means nothing to update. Retain: a dev domain can't be deleted.
apiVersion: ingress.k8s.ngrok.com/v1alpha1
kind: Domain
metadata:
  name: cape-lethargic-sizing-ngrok-free-dev
  namespace: agentgateway-system
spec:
  domain: cape-lethargic-sizing.ngrok-free.dev
  description: Your dev domain
  metadata: ""
  reclaimPolicy: Retain
---
apiVersion: ngrok.k8s.ngrok.com/v1alpha1
kind: AgentEndpoint
metadata:
  name: abox
  namespace: agentgateway-system
spec:
  url: https://cape-lethargic-sizing.ngrok-free.dev
  upstream:
    url: http://agentgateway-external.agentgateway-system:80
  trafficPolicy:
    inline:
      on_http_request:
        - actions:
            - type: oauth
              config:
                provider: google
        - expressions:
            - "!(actions.ngrok.oauth.identity.email in ['vano3231@gmail.com'])"
          actions:
            - type: deny
              config:
                status_code: 403
