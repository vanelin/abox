# OpenTelemetry Demo -- https://opentelemetry.io/docs/demo/kubernetes-deployment/
#
# The reference microservices app the OTel project ships to exercise traces,
# metrics and logs end to end. Chart bundles its own backends as subcharts
# (jaeger, prometheus, grafana, opensearch) -- all `enabled: true` by default.
#
# HTTP Helm repo, like qdrant/neo4j/llm-d -- the chart is not published to an
# OCI registry, so this is chart.spec + HelmRepository, not chartRef.
#
# Not wired onto agentgateway-external. frontend-proxy (the chart's single
# envoy entrypoint, fronting the web UI, jaeger UI, grafana and flagd UI) is
# built to own the root path -- kagent.yaml already claims "/" on that
# listener for its own UI, and frontend-proxy's Next.js frontend and the
# jaeger/grafana subpaths behind it are not written to tolerate being
# reachable under a further prefix (a gateway URLRewrite only rewrites the
# inbound request path, not the absolute asset paths the frontend serves).
# Its routing is baked into the frontend-proxy image itself too -- there is
# no envoy config in this chart to add a path to even for in-cluster access.
# Access is via the docs' own default instead (Service names are the bare
# component name here, not release-prefixed):
#
#   kubectl port-forward -n otel-demo svc/frontend-proxy 8080:8080
#
# then http://localhost:8080/ for the web store, /chatbot/, /jaeger/ui/,
# /grafana/, /telemetry/, /feature/ -- the exact list the chart's own
# post-install NOTES.txt prints. No /loadgen: the chart's default
# component.load-generator.env pins LOCUST_HEADLESS: "true", unlike
# docker-compose's LOCUST_HEADLESS=false, so upstream's screenshots of a
# Locust UI are docker-compose-only unless overridden. Overridden here via
# envOverrides (merged onto the chart's env by name, not a wholesale
# replacement -- see the chart's otel-demo.envOverriden helper) plus a
# service.port so the chart renders a Service at all (load-generator gets
# none by default: no .service block, no .ports). Locust's own default web
# port is 8089, unset here same as upstream, so the two line up:
#
#   kubectl port-forward -n otel-demo svc/load-generator 8089:8089
apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
  # Scopes this namespace into the triage agent (cluster mode) as tenant
  # otel-demo. Declared here because the releases Kustomization prunes
  # annotations added by hand on its next reconcile.
  annotations:
    triage/tenant: otel-demo
    triage/virtual-app-identity: workload
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-demo
  namespace: otel-demo
spec:
  interval: 1h
  releaseName: opentelemetry-demo
  chart:
    spec:
      chart: opentelemetry-demo
      version: "0.41.2"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    createNamespace: true
  values:
    components:
      load-generator:
        envOverrides:
          - name: LOCUST_HEADLESS
            value: "false"
        service:
          port: 8089
    # Lab 6: chart 0.41.2 defines transform/sanitize_spans -- it normalises span
    # names so the span_metrics connector does not mint a series per URL -- but
    # its traces pipeline lists transform/sanitize_logs instead, which holds
    # only log statements and does nothing to a span. Helm replaces a list
    # rather than merging it, so the whole processors list is restated with
    # that one name corrected; receivers and exporters stay the chart's.
    # Lab 6: at the chart's 400Mi Prometheus was OOM-killed.
    prometheus:
      server:
        resources:
          limits:
            memory: 1Gi
    # Lab 7: off, as in the instructor's setup; it crash-looped here in lab 6.
    # Jaeger, Grafana and Prometheus stay: they are the "standard OTel" side of
    # the lab 7 comparison, and observability-agent reads Prometheus via Grafana.
    opensearch:
      enabled: false
    opentelemetry-collector:
      config:
        exporters:
          # Agent spans (kagent and the shop's agent) also go to Phoenix.
          otlphttp/phoenix:
            endpoint: http://phoenix-svc.phoenix:6006
          # Lab 7: every trace also goes to MLflow, via releases/mlflow-otel-collector.yaml.
          otlp_grpc/mlflow-bridge:
            endpoint: otel-collector.mlflow.svc.cluster.local:4317
            tls:
              insecure: true
        processors:
          # filter DROPS what matches: everything but kagent and the shop's agent.
          filter/genai_only:
            error_mode: ignore
            traces:
              span:
                - resource.attributes["service.namespace"] != "kagent" and resource.attributes["service.name"] != "agent" and resource.attributes["service.name"] != "chatbot"
                # kagent's UI polling the controller; the A2A call of an agent run is kept
                - resource.attributes["service.namespace"] == "kagent" and IsMatch(name, "^(GET|POST|PUT|DELETE) /api/") and not IsMatch(name, "/api/a2a/")
          # Phoenix-only extra on top of the shared gen_ai_normalizer: Phoenix
          # shows Input/Output only from these two attributes.
          transform/phoenix_io:
            error_mode: ignore
            trace_statements:
              - context: span
                statements:
                  - set(attributes["input.value"], attributes["gcp.vertex.agent.llm_request"]) where attributes["gcp.vertex.agent.llm_request"] != nil
                  - set(attributes["output.value"], attributes["gcp.vertex.agent.llm_response"]) where attributes["gcp.vertex.agent.llm_response"] != nil
                  - set(attributes["input.value"], attributes["gcp.vertex.agent.tool_call_args"]) where attributes["gcp.vertex.agent.tool_call_args"] != nil
                  - set(attributes["output.value"], attributes["gcp.vertex.agent.tool_response"]) where attributes["gcp.vertex.agent.tool_response"] != nil
                  - set(attributes["input.mime_type"], "application/json") where attributes["input.value"] != nil
                  - set(attributes["output.mime_type"], "application/json") where attributes["output.value"] != nil
        service:
          pipelines:
            traces/genai:
              receivers: [otlp]
              processors: [memory_limiter, filter/genai_only, gen_ai_normalizer, transform/phoenix_io, batch]
              exporters: [otlphttp/phoenix]
            # OpenSearch is off; otherwise its exporter retries and queues every batch.
            logs:
              exporters: [debug]
            traces:
              exporters: [otlp_grpc/jaeger, debug, span_metrics, otlp_grpc/mlflow-bridge]
              processors:
                - memory_limiter
                - resourcedetection
                - resource
                - transform/sanitize_spans
                - gen_ai_normalizer
---
# Lab 7: the demo's UIs on the ngrok domain. frontend-proxy already serves each
# under its own prefix; the shop itself stays off, / belongs to kagent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  parentRefs:
    - name: agentgateway-external
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /jaeger
        - path:
            type: PathPrefix
            value: /grafana
        - path:
            type: PathPrefix
            value: /feature
        - path:
            type: PathPrefix
            value: /chatbot
      backendRefs:
        - name: frontend-proxy
          port: 8080
