# ngrok operator -- https://ngrok.com/docs/k8s/
#
# In the CRD bundle so its CRDs exist before releases/ngrok-operator.yaml uses
# them (instructor's split, feat/otel-demo 932da0f). Credentials come from the
# Secret ngrok-operator-credentials, made by scripts/secrets.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: ngrok-operator
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ngrok
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.ngrok.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ngrok-operator
  namespace: ngrok-operator
spec:
  interval: 1h
  releaseName: ngrok-operator
  chart:
    spec:
      chart: ngrok-operator
      version: "0.24.0"
      sourceRef:
        kind: HelmRepository
        name: ngrok
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: -1
  values:
    credentials:
      secret:
        name: ngrok-operator-credentials
