# MCP servers run by kagent's kmcp controller. kmcp creates a Service named
# after the MCPServer and adapts stdio servers to streamable HTTP.
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: neo4j-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: neo4j/mcp:v1.6.0
    cmd: /app/neo4j-mcp
    env:
      NEO4J_MCP_URI: bolt://neo4j.neo4j:7687
      NEO4J_MCP_USERNAME: neo4j
      # Matches releases/neo4j.yaml.
      NEO4J_MCP_PASSWORD: abox-neo4j
      NEO4J_MCP_DATABASE: neo4j
      NEO4J_MCP_READ_ONLY: "false"
      NEO4J_MCP_TELEMETRY: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # Ours; scaffolded with `kmcp init go`, source in mcp/qdrant-mcp. Replaces
    # mcp-server-qdrant, which could only embed in-process with fastembed and
    # was OOMKilled doing it.
    image: ghcr.io/den-vasyliev/abox/qdrant-mcp:0.4.0
    cmd: /app/server
    env:
      # Any OpenAI-compatible /v1/embeddings route. The standalone llama.cpp
      # Deployment, serving nomic-embed-text-v1.5 as f16 at 8 slots x 2048 ctx.
      # This is the starting point of the migration exercise; the other route is
      # llm-d's decode Service:
      #
      #   http://llm-d-embedding.llm-d:8000
      #
      # hit directly rather than through the EPP, whose scorers are built for
      # generation traffic, not a pooling runner's single-shot embed. Direct
      # means no model-based routing, so EMBEDDINGS_MODEL stays unset there too:
      # llama.cpp ignores it and serves the one GGUF it was given. A managed
      # endpoint would need EMBEDDINGS_MODEL and EMBEDDINGS_API_KEY -- see
      # mcp/qdrant-mcp/README.md, "Switching the embeddings backend".
      #
      # chat returns 501 against either: both are started with --embeddings and
      # have no generation head.
      EMBEDDINGS_BASE_URL: http://llama-cpp-embeddings.llama-cpp:8090
      # vector_store / vector_find embed through the same endpoint, so the
      # agent's memory lands in the vector space the gateway serves. The
      # collection is named for that space. llm-d serves the same model at Q8_0
      # rather than f16 -- same 768 dims, different kernels -- so the two routes
      # are two spaces and the vectors do not transfer. Repointing
      # EMBEDDINGS_BASE_URL is therefore a re-embed, not a copy.
      QDRANT_URL: http://qdrant.qdrant:6333
      QDRANT_COLLECTION: abox-nomic
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-mcp-official
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # Lab 4: the official qdrant/mcp-server-qdrant next to our Go qdrant-mcp
    # above, so the two toolsets can be compared on the same data. Upstream
    # publishes no image, only a PyPI package, so it is run with uvx and the
    # version is pinned there. Its only embedding provider is fastembed, which
    # runs an ONNX model inside this pod; all-MiniLM-L6-v2 (384 dims, ~90MB)
    # fits the limit below, the f32 nomic ONNX did not (see qdrant-mcp's
    # README). The model is downloaded from HuggingFace on first start, so the
    # kind nodes need egress (make fix-egress) and the first readiness takes a
    # minute.
    #
    # Its vectors are a different space from qdrant-mcp's 768-dim nomic ones,
    # hence its own collection; the two never share one.
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    cmd: uvx
    args:
      - mcp-server-qdrant@0.8.1
    env:
      QDRANT_URL: http://qdrant.qdrant:6333
      COLLECTION_NAME: abox-minilm
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      QDRANT_SEARCH_LIMIT: "5"
      # The defaults talk about "memories" and "personal information about the
      # user", which steers the agent away from using the tools for manifests.
      TOOL_STORE_DESCRIPTION: >-
        Index a Kubernetes manifest, a file section or a note of the abox
        repository for later semantic search. Pass the full text as
        `information` and put path, kind, name and namespace in `metadata` so a
        hit can be traced back to its source.
      TOOL_FIND_DESCRIPTION: >-
        Semantic search over what qdrant-store has indexed: Kubernetes
        manifests, OpenTofu, scripts and docs of the abox repository. Use it
        for questions about the content of an object -- what it configures,
        which file does X, where something is set. Returns the stored text
        with its metadata, best match first.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
