apiVersion: v1
kind: Namespace
metadata:
  name: kagent
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
  ref:
    tag: "0.10.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  interval: 1h
  releaseName: kagent
  # Flux appends the OCIRepository artifact digest to the chart version as
  # semver build metadata, so Helm sees 0.10.1+dc7fc6109072. kagent's Chart.yaml
  # has no appVersion, so app.kubernetes.io/version falls back to .Chart.Version
  # and inherits the '+', which Kubernetes rejects as a label value:
  #
  #   ServiceAccount "kagent-controller" is invalid: metadata.labels:
  #   Invalid value: "0.10.1+dc7fc6109072"
  #
  # Subcharts are unaffected -- they carry their own Chart.Version -- which is
  # why tools, kmcp and grafana-mcp installed while the controller, UI,
  # postgresql, ModelConfig and RemoteMCPServer did not. All 21 broken objects
  # carry app.kubernetes.io/name=kagent, so rewrite the label on those.
  #
  # This is not visible in a local `helm template`: the build metadata is added
  # by Flux, not by the chart.
  postRenderers:
  - kustomize:
      patches:
      - patch: |
          - op: add
            path: /metadata/labels/app.kubernetes.io~1version
            value: "0.10.1"
        target:
          labelSelector: app.kubernetes.io/name=kagent
  dependsOn:
    - name: kagent-crds
      namespace: kagent
  chartRef:
    kind: OCIRepository
    name: kagent
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # Image tags must be set explicitly. Left unset, the chart falls back to
    # .Chart.Version for the image reference, which Flux has made
    # 0.10.1+dc7fc6109072 -- and '+' is not legal in a tag:
    #
    #   Failed to apply default image tag
    #   "ghcr.io/kagent-dev/kagent/controller:0.10.1+dc7fc6109072":
    #   invalid reference format ... InvalidImageName
    #
    # The chart sanitises the '+' for helm.sh/chart but not for the image tags
    # or app.kubernetes.io/version, which the postRenderer above handles.
    # Postgres and the subcharts pin their own images and are unaffected.
    tag: "0.10.1"
    controller:
      image:
        tag: "0.10.1"
    ui:
      image:
        tag: "0.10.1"
    # 0.10.x drops the per-tool toggles that used to disable querydoc, so the
    # kagent-tools subchart is left at its default.
    istio-agent:
      enabled: false
    # Lab 4: the chart's k8s-agent is replaced by our own Agent of the same
    # name in releases/agent-retrieval.yaml. The chart hardcodes its system
    # prompt (charts/k8s-agent/templates/agent.yaml), and that prompt's
    # "Response Format" makes it summarise tool output into prose -- as a
    # delegate for the retrieval agents' ingest it never returned a manifest.
    # Only modelConfigRef is a value, so the prompt cannot be tuned in place.
    k8s-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    # No apiKey here on purpose. With one, the chart renders the Secret
    # kagent-openai itself (templates/modelconfig-secret.yaml) and every Helm
    # upgrade overwrites the hand-made key with that value -- the placeholder
    # OPENAI_API_KEY used to sit here and did exactly that. Without it the
    # chart only references the Secret (apiKeySecretRef defaults to
    # kagent-openai), which is created by hand and never enters git.
    providers:
      default: openAI
    # Traces go to the demo's collector, which fans them out to Jaeger, Phoenix
    # and MLflow. Not to a backend directly: the chart cannot set OTLP headers
    # (kagent #2126).
    # Prompts and answers are captured by default; public lab data only.
    otel:
      tracing:
        enabled: true
        exporter:
          otlp:
            endpoint: http://otel-collector.otel-demo:4317
            protocol: grpc
            timeout: 15000   # milliseconds
            insecure: true
    # Grafana MCP for observability-agent: base URL, no /api, no token
    # (the demo's Grafana is anonymous Admin: outside only behind ngrok's sign-in).
    grafana-mcp:
      grafana:
        url: http://grafana.otel-demo
      # mcp-grafana answers 403 to any Host but localhost unless it is listed.
      args:
        - --allowed-hosts
        - kagent-grafana-mcp.kagent:8000,kagent-grafana-mcp.kagent
    # Subchart with its own otel block; without it tool calls leave no spans.
    kagent-tools:
      otel:
        tracing:
          enabled: true
          exporter:
            otlp:
              endpoint: http://otel-collector.otel-demo:4317
              timeout: 15    # seconds in this subchart, not milliseconds
              insecure: true
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kagent
  namespace: kagent
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: kagent
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: kagent-controller
      namespace: kagent
      port: 8083
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kagent-ui
      namespace: kagent
      port: 8080
