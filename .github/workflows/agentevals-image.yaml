# Builds the agentevals-go image from our copy in agentevals
# (upstream triageagent-dev/evals@54107cf plus our changes) with its own
# Makefile. The tag lives in that Makefile.
name: Build agentevals-go image

on:
  push:
    branches: [lab/08-evals]
    paths:
      - 'agentevals/**'
      - '.github/workflows/agentevals-image.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agentevals/go.mod

      - name: Test
        run: go test ./...
        working-directory: agentevals

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: make -C agentevals push
